name: Build and Deploy

on:
  push:
    tags:
      - 'v*'

# Serialize deploys: a queued release waits for a running one instead of
# racing it on the host (complements the deploy script's single-flight lock).
concurrency:
  group: devify-deploy
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: registry.cn-beijing.aliyuncs.com/oneprolabs
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  UI_IMAGE_NAME: devify-ui
  HOME_IMAGE_NAME: devify-home
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_EMAIL_DOMAIN: ${{ vars.VITE_EMAIL_DOMAIN }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR oneprolabs
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata for backend image
        id: backend-meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          build-args: |
            USE_MIRROR=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # arm64 is off for now: it is built under QEMU on an x86
          # runner, where the UI image's `npm ci` has hung for hours
          # at a time, and no host we deploy to is arm64. Add it back
          # here — and to the verification below — when the release
          # needs it, ideally on a native arm runner rather than QEMU.
          platforms: linux/amd64
          # Aliyun ACR rejects the OCI `empty.v1+json` media type that
          # buildx uses for provenance and SBOM attestations. The image
          # itself pushes fine and then the attestation is denied,
          # failing the release — every one since 11 August. We do not
          # consume the attestations, so they are turned off.
          provenance: false
          sbom: false

      - name: Extract metadata for UI image
        id: ui-meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.UI_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: ${{ steps.ui-meta.outputs.tags }}
          labels: ${{ steps.ui-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_EMAIL_DOMAIN=${{ env.VITE_EMAIL_DOMAIN != '' && env.VITE_EMAIL_DOMAIN || 'devify.local' }}
            VITE_SENTRY_DSN=${{ env.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ env.VITE_SENTRY_ENVIRONMENT != '' && env.VITE_SENTRY_ENVIRONMENT || 'production' }}
            VITE_SENTRY_RELEASE=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # arm64 is off for now: it is built under QEMU on an x86
          # runner, where the UI image's `npm ci` has hung for hours
          # at a time, and no host we deploy to is arm64. Add it back
          # here — and to the verification below — when the release
          # needs it, ideally on a native arm runner rather than QEMU.
          platforms: linux/amd64
          # Aliyun ACR rejects the OCI `empty.v1+json` media type that
          # buildx uses for provenance and SBOM attestations. The image
          # itself pushes fine and then the attestation is denied,
          # failing the release — every one since 11 August. We do not
          # consume the attestations, so they are turned off.
          provenance: false
          sbom: false

      - name: Extract metadata for homepage image
        id: home-meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.HOME_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # The homepage used to live in its own repository and release on its
      # own tags. It builds here now so that one tag produces the api, ui
      # and homepage images together and a rollback moves all three back to
      # the same version. Its Dockerfile copies with paths relative to the
      # site root, so the context is home/ rather than the repository root.
      - name: Build and push homepage image
        uses: docker/build-push-action@v5
        with:
          context: ./home
          file: ./home/Dockerfile
          push: true
          tags: ${{ steps.home-meta.outputs.tags }}
          labels: ${{ steps.home-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # See the backend image above: Aliyun ACR rejects buildx
          # attestations, so they are turned off here too.
          provenance: false
          sbom: false

      - name: Verify published image platforms
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          for image_name in "${IMAGE_NAME}" "${UI_IMAGE_NAME}" "${HOME_IMAGE_NAME}"; do
            image="${ALIYUN_REGISTRY}/${image_name}:${version}"
            # Resolve through .Image rather than the raw manifest. A
            # single-platform push is a plain image manifest: it has no
            # .manifests array for the old jq to walk, and carries no
            # architecture of its own — that lives in the config blob. So
            # the previous check failed every amd64-only build, which is
            # every build since arm64 was dropped. .Image is the resolved
            # config for a lone platform and a map of them for a manifest
            # list, and the recursive match below reads both.
            resolved="$(docker buildx imagetools inspect --format '{{json .Image}}' "${image}")"
            for arch in amd64; do
              if ! printf '%s' "${resolved}" | jq -e --arg arch "${arch}" \
                'any(..|objects|select(has("architecture") and has("os"));
                     .os == "linux" and .architecture == $arch)' \
                >/dev/null; then
                echo "Missing linux/${arch} in ${image}" >&2
                exit 1
              fi
            done
            echo "Verified the linux/amd64 manifest in ${image}"
          done

      # Auto-deploy gate: the image build/push above always runs on a tag, but
      # deploying to the host runs ONLY when the repo/environment variable
      # DEVIFY_AUTO_DEPLOY is "true". Leave it unset (or "false") to build the
      # release without touching production — e.g. during the blue/green
      # cutover, deploy manually in a maintenance window
      # (DEVIFY_REF=<tag> ./deploy/scripts/devify-deploy.sh upgrade) — then set it to
      # "true" for hands-off zero-downtime releases. Toggling it needs no
      # workflow edit, just a GitHub Variables change.
      - name: Install SSH Key
        if: ${{ vars.DEVIFY_AUTO_DEPLOY == 'true' }}
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: fail

      - name: Deploy aimychats production
        if: ${{ vars.DEVIFY_AUTO_DEPLOY == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEVIFY_DEPLOY_SSH_HOST }}
          username: ${{ vars.DEVIFY_DEPLOY_SSH_USER }}
          port: ${{ vars.DEVIFY_DEPLOY_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/devify-deploy
            DEVIFY_REF=${{ github.ref_name }} ./deploy/scripts/devify-deploy.sh upgrade
            # Scoped to images this repository publishes. `docker system
            # prune -f` reaches the whole host, and this host also runs
            # sourcelens — itself blue/green, so a colour it had stopped for
            # inspection was a stopped container our deploy would delete.
            # The deploy's own prune_old_images handles version retention;
            # this only sweeps the dangling layers a moved :latest leaves,
            # which that function deliberately skips.
            docker image prune -f \
              --filter "label=org.opencontainers.image.source=https://github.com/oneprolabs/devify"

  # Docker Hub is a convenience mirror, mainly for installs outside China
  # that would otherwise pull from Aliyun ACR. It is deliberately a separate
  # job that copies the already-published manifests rather than a second
  # push target on the build steps: an expired Docker Hub token then fails
  # this job alone, and never a production release. It also costs no build
  # time, since imagetools copies the manifest instead of rebuilding.
  mirror-to-dockerhub:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: ${{ vars.DOCKERHUB_NAMESPACE != '' }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR oneprolabs
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy release images to Docker Hub
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          major_minor="${version%.*}"
          major="${version%%.*}"
          for image_name in "${IMAGE_NAME}" "${UI_IMAGE_NAME}" "${HOME_IMAGE_NAME}"; do
            source="${ALIYUN_REGISTRY}/${image_name}:${version}"
            target="docker.io/${DOCKERHUB_NAMESPACE}/${image_name}"
            docker buildx imagetools create \
              -t "${target}:${version}" \
              -t "${target}:${major_minor}" \
              -t "${target}:${major}" \
              -t "${target}:latest" \
              "${source}"
            echo "Mirrored ${source} to ${target}"
          done
