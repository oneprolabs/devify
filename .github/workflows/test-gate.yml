name: Test gate

# The release gate for the chat-spaces work: backend suite on MariaDB, the
# frontend unit tests, and a production build. Kept in one workflow so a
# release candidate has a single place to check before it is merged.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: devify_ci
          MARIADB_USER: devify
          MARIADB_PASSWORD: devify
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DJANGO_SETTINGS_MODULE: core.settings
      # pytest creates its own test_devify_ci database, and the service
      # image only grants the devify user privileges on devify_ci. Use the
      # root account so the test database can be created and dropped.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/devify_ci?charset=utf8mb4
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -eux
          pip install uv
          uv pip compile pyproject.toml --extra dev -o requirements-ci.txt
          uv pip install --system -r requirements-ci.txt

      - name: Django system check
        working-directory: devify
        run: python manage.py check

      - name: Migrations are complete
        working-directory: devify
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate an empty database
        working-directory: devify
        run: python manage.py migrate --noinput

      - name: Backend tests
        working-directory: devify
        run: |
          python -m pytest -q -p no:sugar \
            accounts/tests \
            spaces/tests \
            chat_analysis/tests \
            chat_domain/tests \
            chat_ingestion/tests \
            threadline/tests \
            relay/tests \
            expense/tests \
            billing/tests \
            core/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
